[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling with constrained decoding"
readme = "README.md"
authors = [
    { name = "Aprilio", email = "nrisk8031@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pydantic",
    "llm-sdk"
]

[tool.uv.sources]
llm-sdk = { path = "llm_sdk", editable = true }

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""